<style>

--px:"VT323",ui-monospace,Menlo,monospace;--px2:"Press Start 2P",ui-monospace,monospace}

main{flex:1;display:flex;min-height:0}
aside{width:350px;flex:none;border-right:4px double var(--gold2);overflow:auto;padding:12px 14px 40px;
  background:repeating-linear-gradient(90deg,#2a0c14 0 8px,#260a12 8px 16px)}
section.res{flex:1;display:flex;flex-direction:column;min-width:0;
  background-image:radial-gradient(#2a0f16 1px,transparent 1px);background-size:6px 6px}
.group{margin-bottom:16px}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:7px}

.dd{position:relative}

#rulebar{padding:10px 16px;border-bottom:2px dashed var(--gold2);background:#3a2410;color:#2a1608;background:var(--cream,#ecd9a6);

#grid{flex:1;overflow:auto;padding:4px 16px 24px;display:grid;gap:12px;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:max-content;align-content:start}
#grid.large{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{display:block;color:inherit;background:#2a0c14;border:2px solid var(--gold2);overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:4px 4px 0 #000}

.sheet .sub{color:var(--mut);margin-bottom:10px;font-size:20px}
.sheet .row{margin:10px 0;font-size:21px;line-height:1.15}

<body>
<header>
  <h1>idk<span>youpick</span></h1>
  <div class="sp"></div>
  <select class="btn" id="sortSel" title="Sort"><option value="pop">Sort: Most popular</option><option value="rt">Sort: Rotten Tomatoes</option><option value="imdb">Sort: IMDb score (5,000+ votes)</option><option value="new">Sort: Newest (released)</option></select>
  <button class="btn" id="sizeBtn">Larger cards</button>
  <button class="btn" id="clearBtn">Clear all</button>
  <button class="btn pri" id="pickBtn">Pick One For Me</button>
</header>
<div class="bulbs"></div>
<main>
  <aside id="filters"></aside>
  <section class="res">
    <div id="rulebar"></div>
    <div id="meta"></div>
    <div id="grid"></div>
  </section>
</main>
<div id="modal"></div>

<script>
/* Keyless data source: JustWatch's public GraphQL endpoint (no API key). */
const GQL='/graphql';
const MAX_INFLIGHT=10;let inflight=0,pauseUntil=0;const waiters=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const STALE=new Error('stale');
async function slot(){
  for(;;){
    const wait=pauseUntil-Date.now();if(wait>0)await sleep(wait);
    if(inflight<MAX_INFLIGHT)break;
    await new Promise(r=>waiters.push(r));
  }
  inflight++;
}
function release(){inflight--;const w=waiters.shift();if(w)w()}
const CACHE=new Map();
// POST a GraphQL query: capped concurrency, 2 retries, in-memory response cache, drops work for stale searches.
function gql(query,variables,alive){
  const key=query+JSON.stringify(variables);
  if(CACHE.has(key))return CACHE.get(key);
  const p=(async()=>{
    await slot();
    try{
      if(alive&&!alive())throw STALE;
      for(let attempt=0;;attempt++){
        try{
          const r=await fetch(GQL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables})});
          if(r.status===429||r.status===503){   // the data source is rate-limiting: pause every request, then retry
            const ra=+r.headers.get('retry-after')||0;
            pauseUntil=Math.max(pauseUntil,Date.now()+Math.max(ra*1000,2000*(attempt+1)));
            throw new Error('HTTP '+r.status);
          }
          if(!r.ok)throw new Error('HTTP '+r.status);
          const d=await r.json();
          if(d.errors&&!d.data)throw new Error(d.errors[0].message);
          return d.data;
        }catch(e){if(attempt>=5)throw e;await sleep(300*(attempt+1))}
      }
    }finally{release()}
  })();
  CACHE.set(key,p);
  p.catch(()=>CACHE.delete(key));
  if(CACHE.size>800)CACHE.delete(CACHE.keys().next().value);
  return p;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster=(u,p='s332')=>u?'https://images.justwatch.com'+u.replace('{profile}',p).replace('{format}','webp'):'';

/* ---------- static config ---------- */
const GENRE_LIST=[['act','Action & Adventure'],['ani','Animation'],['cmy','Comedy'],['crm','Crime'],['doc','Documentary'],['drm','Drama'],['fml','Family'],['fnt','Fantasy'],['hst','History'],['hrr','Horror'],['msc','Music & Musical'],['trl','Mystery & Thriller'],['rma','Romance'],['scf','Sci-Fi'],['spt','Sport'],['war','War'],['wsn','Western']];
const GNAME=Object.fromEntries(GENRE_LIST);
const RATINGS=['G','PG','PG-13','R'];
const DECADES=[1950,1960,1970,1980,1990,2000,2010,2020];
const COUNTRIES=[['United States','US'],['United Kingdom','GB'],['France','FR'],['Japan','JP'],['South Korea','KR'],['India','IN'],['Germany','DE'],['Italy','IT'],['Spain','ES'],['China','CN']];
const GROUPS=[['genres','Genres'],['keywords','Period & themes'],['people','Cast & crew'],['ratings','Audience rating'],['decades','Era'],['countries','Made in'],['score','Scores']];

/* ---------- tags: TMDB community keywords, fetched through our /api/tmdb function (the key never reaches the browser) ---------- */
const TAG_GROUPS=[
 ['Period & setting',[['18th century',160279],['19th century',207928],['Victorian England',8250],['Medieval',161257],['Ancient Rome',5049],['Ancient Greece',162861],['World War I',2504],['World War II',1956],['Cold War',2106],['Vietnam War',2957],['American Civil War',179585],['Wild West',155573],['Prohibition era',947],['1920s',207876],['1950s',208611],['1970s',1228],['1980s',208289]]],
 ['Themes',[['Heist',10051],['Time travel',4379],['Dystopia',4565],['Post-apocalyptic',4458],['Whodunit',12570],['Serial killer',10714],['Haunted house',3358],['Revenge',9748],['Coming of age',10683],['Road trip',7312],['Based on true story',9672],['Based on a book',818],['Small town',1415],['Zombie',12377],['Spy',470],['Con artist',10453],['Courtroom',33519],['Period drama',15060],['Neo-noir',207268],['Dark comedy',10123]]]
];
const TAG_NAME=Object.fromEntries(TAG_GROUPS.flatMap(([,l])=>l.map(([n,i])=>[i,n])));
let TAGSET=new Set();
async function tmdbGet(path,params={}){
  const r=await fetch('/api/tmdb?'+new URLSearchParams({path,...params}));
  if(!r.ok)throw new Error('tmdb '+r.status);
  return r.json();
}
// Movies carrying the chosen tags (ALL = comma, ANY = pipe), most popular first, up to 2,000.
async function fetchTagSet(my){
  const q={with_keywords:S.keywords.list.map(k=>k.id).join(S.keywords.mode==='OR'?'|':','),sort_by:'popularity.desc',include_adult:'false'};
  const first=await tmdbGet('/discover/movie',{...q,page:1});
  const pagesOut=[first.results];
  const pages=Math.min(first.total_pages||1,100);
  const rest=await Promise.all(Array.from({length:Math.max(pages-1,0)},async(_,k)=>{
    await slot();
    try{return my===token?(await tmdbGet('/discover/movie',{...q,page:k+2})).results:[]}
    catch(e){return[]}finally{release()}
  }));
  const films=[...pagesOut,...rest].flat().map(r=>({id:r.id,title:r.title,year:parseInt((r.release_date||'').slice(0,4))||0}));
  return{films,set:new Set(films.map(f=>f.id)),total:first.total_results||films.length};
}
// Look tagged films up on the movie service directly: ~20 per request (aliased queries), matched by TMDB id.
const normT=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
async function resolveBatch(films,my){
  const parts=films.map((f,i)=>`a${i}:popularTitles(country:US,first:5,filter:{objectTypes:[MOVIE],${f.year?`releaseYear:{min:${f.year-1},max:${f.year+1}},`:''}searchQuery:${JSON.stringify(f.title)}}){edges{node{id objectId ... on Movie{content(country:US,language:en){${FIELDS}}}}}}`);
  const d=await gql(`query{${parts.join('\n')}}`,{},()=>my===token);
  const out=[];
  films.forEach((f,i)=>{
    const nodes=((d['a'+i]||{}).edges||[]).map(e=>e.node).filter(n=>n.content);
    const hit=nodes.find(n=>String(n.content.externalIds&&n.content.externalIds.tmdbId)===String(f.id))
      ||nodes.find(n=>normT(n.content.title)===normT(f.title)&&Math.abs((n.content.originalReleaseYear||0)-f.year)<=1&&!(n.content.externalIds&&n.content.externalIds.tmdbId));
    if(hit)out.push(toMovie(hit));
  });
  return out;
}
// Client-side version of the server filters, for movies that came from a direct lookup.
function filterTest(f,m){
  if(f.releaseYear&&!(m.year>=f.releaseYear.min&&m.year<=f.releaseYear.max))return false;
  if(f.ageCertifications&&!f.ageCertifications.includes(m.cert))return false;
  if(f.imdbScore&&!(m.score>=f.imdbScore.min))return false;
  if(f.tomatoMeter&&!(m.rt>=f.tomatoMeter.min))return false;
  if(f.productionCountries&&!m.countries.some(c=>f.productionCountries.includes(c)))return false;
  if(S.sort==='imdb'&&m.votes<5000)return false;
  if(S.sort==='new'&&m.year>YEAR_NOW)return false;
  return true;
}

/* ---------- state ---------- */
const S={
  genres:{inc:[],exc:[],mode:'AND'},
  keywords:{list:[],mode:'AND'},
  people:{list:[],mode:'AND'},
  ratings:{sel:[]},
  decades:{sel:[]},
  countries:{sel:[]},
  score:{min:0,rt:0},
  conn:{},
  large:false,
  sort:'pop'
};
let POOL=[],token=0;
const SORTS={pop:(a,b)=>b.votes-a.votes,rt:(a,b)=>((b.rt??-1)-(a.rt??-1))||(b.votes-a.votes),imdb:(a,b)=>((b.score||0)-(a.score||0))||(b.votes-a.votes),new:(a,b)=>((b.year||0)-(a.year||0))||(b.votes-a.votes)};

const active=k=>{
  switch(k){
    case'genres':return S.genres.inc.length||S.genres.exc.length;
    case'keywords':return S.keywords.list.length;
    case'people':return S.people.list.length;
    case'ratings':return S.ratings.sel.length;
    case'decades':return S.decades.sel.length;
    case'countries':return S.countries.sel.length;
    case'score':return S.score.min>0||S.score.rt>0;
  }
};
const activeKeys=()=>GROUPS.map(g=>g[0]).filter(active);
const connOf=k=>S.conn[k]||'AND';

/* ---------- query building ---------- */
/* ---------- data loading ---------- */
const SORT_ENUM={pop:'POPULAR',rt:'POPULAR',imdb:'IMDB_SCORE',new:'RELEASE_YEAR'};
const sortKey=s=>s==='rt'?'pop':s;
const YEAR_NOW=new Date().getFullYear();
const CAP=2000; // the data source returns at most ~2000 results per query
const FIELDS='title originalReleaseYear posterUrl ageCertification scoring{imdbScore imdbVotes tomatoMeter} genres{shortName} externalIds{tmdbId} productionCountries';
const listQ=(withDesc,sort)=>`query($f:TitleFilter,$first:Int!,$after:String){popularTitles(country:US,first:$first,after:$after,filter:$f,sortBy:${SORT_ENUM[sort]}){totalCount edges{node{id objectId ... on Movie{content(country:US,language:en){${FIELDS}${withDesc?' shortDescription':''}}}}}}}`;
const toMovie=n=>({id:n.id,oid:n.objectId,title:n.content.title,year:n.content.originalReleaseYear,poster:n.content.posterUrl,cert:n.content.ageCertification,score:n.content.scoring&&n.content.scoring.imdbScore,rt:n.content.scoring&&n.content.scoring.tomatoMeter,desc:n.content.shortDescription||'',tmdb:Number(n.content.externalIds&&n.content.externalIds.tmdbId)||null,votes:(n.content.scoring&&n.content.scoring.imdbVotes)||0,genres:(n.content.genres||[]).map(g=>g.shortName),countries:n.content.productionCountries||[]});
// Sorting by IMDb score or newest needs guards, otherwise obscure 10.0-with-20-votes and unreleased 2031 titles float to the top.
function withSortGuards(f){
  const g={...f};
  if(S.sort==='imdb'){const c=g.imdbVotes||{};g.imdbVotes={...c,min:Math.max(c.min||0,5000)}}
  if(S.sort==='new'){const c=g.releaseYear||{};g.releaseYear={...c,max:Math.min(c.max??9999,YEAR_NOW)}}
  return g;
}
// Year slices for keyword scans: each slice is its own ~2000-result window, so the scan reaches far more of the catalog.
const SCAN_PARTS=[[1900,1959],[1960,1969],[1970,1979],[1980,1984],[1985,1989],[1990,1994],[1995,1999],[2000,2004],[2005,2009],[2010,2014],[2015,2019],[2020,2024],[2025,2029]];

// Stream one query: page 1 first (so results show fast), the remaining pages in parallel.
async function streamQuery(f,test,run,cap,onMovies,strict,noTotal){
  const my=run.my,alive=()=>my===token;
  const full={objectTypes:['MOVIE'],...withSortGuards(f)};
  const q=listQ(run.withDesc,S.sort);
  const getPage=async i=>{
    for(let a=0;;a++){
      try{return await gql(q,{f:full,first:100,after:i?btoa(String(i*100)):null},alive)}
      catch(e){if(!alive())throw STALE;if(e===STALE&&a<2)continue;throw e}
    }
  };
  const absorb=d=>{
    const es=d.popularTitles.edges;run.scanned+=es.length;
    const ms=es.map(e=>e.node).filter(n=>n.content).map(toMovie).filter(m=>(!strict||strict(m))&&(!test||test(m)));
    if(ms.length)onMovies(ms);
    return es.length;
  };
  const first=await getPage(0);
  const total=first.popularTitles.totalCount;
  if(!noTotal)run.total+=total;absorb(first);
  const pages=Math.min(Math.ceil(Math.min(total,cap)/100),20);
  await Promise.all(Array.from({length:Math.max(pages-1,0)},(_,k)=>getPage(k+1).then(absorb).catch(e=>{if(e!==STALE)run.errors++})));
}

// Turn one AND-cluster of groups into alternatives (unioned). Each alt: {filter,test,persons:[ids]}
function clusterAlts(keys){
  let base={},tests=[],stricts=[],deep=false,tagKw=false,persons=[],alts=[{}];
  const cross=(a,b)=>a.flatMap(x=>b.map(y=>({...x,...y})));
  for(const k of keys){
    if(k==='genres'){
      const{inc,exc,mode}=S.genres;
      if(inc.length){
        if(mode==='OR')base.genres=inc;
        else{base.genres=[inc[0]];if(inc.length>1)tests.push(m=>inc.every(g=>m.genres.includes(g)))}
      }
      if(exc.length)base.excludeGenres=exc;
      // the source's genre index and the genre list it displays disagree for a few titles; enforce what is displayed
      if(inc.length)stricts.push(mode==='OR'?(m=>inc.some(g=>m.genres.includes(g))):(m=>inc.every(g=>m.genres.includes(g))));
      if(exc.length)stricts.push(m=>!exc.some(g=>m.genres.includes(g)));
    }else if(k==='keywords'){
      tagKw=true;
    }else if(k==='people'){
      if(S.people.mode==='OR')alts=cross(alts,S.people.list.map(p=>({_persons:[p.id]})));
      else persons=S.people.list.map(p=>p.id);
    }else if(k==='ratings'){base.ageCertifications=S.ratings.sel;}
    else if(k==='decades'){alts=cross(alts,S.decades.sel.map(d=>({releaseYear:{min:d,max:d+9}})));}
    else if(k==='countries'){alts=cross(alts,S.countries.sel.map(c=>({productionCountries:[c]})));}
    else if(k==='score'){
      if(S.score.min>0)base.imdbScore={min:S.score.min};
      if(S.score.rt>0)base.tomatoMeter={min:S.score.rt};
    }
  }
  return alts.map(a=>{
    const{_persons,...rest}=a;
    const pp=_persons||persons;
    const tagged=tagKw&&!pp.length;          // with a person filter there is no id to look up by, so fall back to a scan
    const tl=[...tests];if(tagKw&&!tagged)tl.push(m=>m.tmdb!=null&&TAGSET.has(m.tmdb));
    return{filter:{...base,...rest},test:tl.length?(m=>tl.every(f=>f(m))):null,strict:stricts.length?(m=>stricts.every(f=>f(m))):null,deep:tagKw&&!tagged,tagged,persons:pp};
  });
}
// AND binds tighter than OR: split into clusters at each OR connector.
function buildAlts(){
  const keys=activeKeys();
  if(!keys.length)return[{filter:{},test:null,strict:null,deep:false,tagged:false,persons:[]}];
  const clusters=[];
  keys.forEach((k,i)=>{if(i===0||connOf(k)==='OR')clusters.push([k]);else clusters[clusters.length-1].push(k)});
  return clusters.flatMap(clusterAlts);
}
async function runAlt(a,run,add,cap){
  const my=run.my;
  if(a.tagged){
    const post=m=>filterTest(a.filter,m)&&(!a.strict||a.strict(m))&&(!a.test||a.test(m));
    const fs=run.tagFilms,batches=[];
    for(let i=0;i<fs.length;i+=20)batches.push(fs.slice(i,i+20));
    await Promise.all(batches.map(async b=>{
      try{const ms=await resolveBatch(b,my);run.scanned+=b.length;run.found+=ms.length;const ok=ms.filter(post);if(ok.length)add(ok)}
      catch(e){if(e!==STALE)run.errors++}
    }));
    return;
  }
  let parts=[{}];
  // Client-side filters (keywords, several required genres) need to scan titles. If more than one query window
  // (~2000 results) fits the other filters, split the scan into year slices so far more of the catalog is covered.
  if(a.test&&!a.filter.releaseYear&&a.persons.length<2){
    const f={objectTypes:['MOVIE'],...withSortGuards(a.filter),...(a.persons.length?{personId:a.persons[0]}:{})};
    const probe=await gql('query($f:TitleFilter){popularTitles(country:US,first:1,filter:$f){totalCount}}',{f},()=>my===token);
    if(probe.popularTitles.totalCount>cap*0.95)parts=SCAN_PARTS.map(([min,max])=>({releaseYear:{min,max}}));
  }
  if(a.persons.length<=1){
    const extra=a.persons.length?{personId:a.persons[0]}:{};
    return Promise.all(parts.map(p=>streamQuery({...a.filter,...p,...extra},a.test,run,cap,add,a.strict)));
  }
  // ALL of several people: collect each person's list, then keep titles present in every list
  const lists=await Promise.all(a.persons.map(async pid=>{
    const got=[];
    await streamQuery({...a.filter,personId:pid},a.test,run,cap,ms=>got.push(...ms),a.strict,true);
    return got;
  }));
  const ids=lists.map(l=>new Set(l.map(m=>m.id)));
  const both=lists[0].filter(m=>ids.every(s=>s.has(m.id)));
  run.total+=both.length;add(both);
}

/* ---------- refresh ---------- */
let deb,RUN=null,SHOW=100;
function schedule(){renderFilters();renderRule();clearTimeout(deb);deb=setTimeout(refresh,250)}
function pushUpdate(run){
  const flush=()=>{run.dirty=false;if(run.my===token)syncPool(run)};
  if(!run.swapped)return flush();            // first results replace the old view immediately
  if(run.dirty)return;run.dirty=true;setTimeout(flush,2000);   // then at most every 2s, so the grid does not churn
}
function syncPool(run){
  const grid=document.getElementById('grid');
  if(!run.swapped){run.swapped=true;SHOW=100;grid.scrollTop=0;grid.classList.remove('stale')}
  else if(grid.scrollTop>200){renderMeta();return}   // don't reshuffle while the user is scrolling
  POOL=[...run.pool.values()].sort(SORTS[S.sort]);
  renderGrid(null);
}
async function refresh(){
  const my=++token;
  const run=RUN={my,pool:new Map(),total:0,scanned:0,found:0,errors:0,pending:true,dirty:false,swapped:false,hasTest:false,tagged:false,withDesc:false,alts:1,sort:S.sort,tagTotal:0,tagFilms:[]};
  const grid=document.getElementById('grid');
  if(POOL.length)grid.classList.add('stale');else renderGrid(null);   // keep the previous results on screen (dimmed) instead of blanking
  const finish=()=>{grid.classList.remove('stale')};
  if(activeKeys().includes('keywords')){
    try{const r=await fetchTagSet(my);if(my!==token)return;TAGSET=r.set;run.tagTotal=r.total;run.tagFilms=r.films}
    catch(e){if(my!==token)return;run.pending=false;finish();renderGrid('Could not load tags right now. Try again in a moment.',true);return}
    if(!TAGSET.size){run.pending=false;finish();POOL=[];run.swapped=true;renderGrid(null);return}
  }
  const alts=buildAlts();
  run.hasTest=alts.some(a=>a.test);run.tagged=alts.some(a=>a.tagged);run.alts=alts.length;
  const cap=alts.length>1?1000:CAP;
  const add=ms=>{ms.forEach(m=>{if(!run.pool.has(m.id))run.pool.set(m.id,m)});pushUpdate(run)};
  const results=await Promise.allSettled(alts.map(a=>runAlt(a,run,add,cap)));
  if(my!==token)return;
  run.pending=false;finish();
  if(results.every(r=>r.status==='rejected')&&results.some(r=>r.reason!==STALE)){
    renderGrid('Could not reach the movie service. Check your connection and try again.',true);return}
  POOL=[...run.pool.values()].sort(SORTS[S.sort]);
  if(!run.swapped){run.swapped=true;SHOW=100;document.getElementById('grid').scrollTop=0}
  if(!POOL.length&&run.errors){renderGrid('The movie service is busy right now, so some results could not load. Wait a few seconds and try again.',true);return}
  renderGrid(null);
}

function renderRule(){

const cardHTML=m=>`<button class="card" data-movie="${esc(m.id)}">${m.poster?`<img loading="lazy" src="${poster(m.poster)}" alt="${esc(m.title)}">`:`<div class="ph">${esc(m.title)}</div>`}

const fmt=n=>Number(n).toLocaleString('en-US');
function renderMeta(){
  const meta=document.getElementById('meta'),r=RUN;
  if(!r){meta.textContent='';return}

}
let io;
function observeMore(){
  if(io)io.disconnect();
  const el=document.getElementById('more');if(!el)return;
  io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();appendMore()}},{root:document.getElementById('grid'),rootMargin:'800px'});
  io.observe(el);
}
// Card elements are created once per movie and reused, so redrawing the grid never reloads posters.
const NODES=new Map();
function cardNode(m){
  let n=NODES.get(m.id);
  if(!n){const t=document.createElement('template');t.innerHTML=cardHTML(m).trim();n=t.content.firstChild;NODES.set(m.id,n);if(NODES.size>4000)NODES.delete(NODES.keys().next().value)}
  return n;
}
function appendMore(){
  const more=document.getElementById('more');if(!more)return;
  const from=SHOW;SHOW+=100;
  more.before(...POOL.slice(from,SHOW).map(cardNode));
  if(POOL.length<=SHOW)more.remove();else observeMore();
}
function renderGrid(msg,isErr){
  const grid=document.getElementById('grid');
  grid.classList.toggle('large',S.large);
  document.getElementById('sizeBtn').textContent=S.large?'Compact cards':'Larger cards';
  if(msg){grid.classList.remove('stale');grid.innerHTML=`<div class="msg ${isErr?'err':''}">${esc(msg)}</div>`;document.getElementById('meta').textContent='';return}
  if(!POOL.length){
    grid.innerHTML=RUN&&RUN.pending?'<div class="msg">Loading…</div>':'<div class="msg">No movies match all of that. Loosen a filter or switch an AND to OR.</div>';
    renderMeta();return;
  }
  const kids=POOL.slice(0,SHOW).map(cardNode);
  if(POOL.length>SHOW){const more=document.createElement('div');more.id='more';more.className='msg';more.textContent='Loading more…';kids.push(more)}
  grid.replaceChildren(...kids);
  observeMore();renderMeta();
}

        const r=d.popularPeople.edges.map(x=>({id:x.node.id,name:x.node.content.fullName})).filter(p=>{
          if(seen.has(p.name)||S.people.list.some(x=>x.id===p.id))return false;seen.add(p.name);return true});
        l.innerHTML=r.map(p=>`<div data-pid="${esc(p.id)}" data-pname="${esc(p.name)}">${esc(p.name)}</div>`).join('')||'<div style="color:var(--mut)">No matches</div>';
        l.hidden=false;
      }catch(err){}
    },250);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='kq'){const first=document.querySelector('#klist div[data-kwadd]');if(first)first.click()}
});
document.getElementById('sortSel').onchange=e=>{
  const old=S.sort;S.sort=e.target.value;SHOW=100;
  if(sortKey(old)===sortKey(S.sort)&&RUN&&!RUN.pending){RUN.sort=S.sort;POOL.sort(SORTS[S.sort]);renderGrid(null)}else refresh();
};
document.getElementById('sizeBtn').onclick=()=>{S.large=!S.large;renderGrid(null)};
document.getElementById('clearBtn').onclick=()=>{
  Object.assign(S,{genres:{inc:[],exc:[],mode:'AND'},keywords:{list:[],mode:'AND'},people:{list:[],mode:'AND'},ratings:{sel:[]},decades:{sel:[]},countries:{sel:[]},score:{min:0,rt:0},conn:{}});
  schedule();
};
document.getElementById('pickBtn').onclick=()=>{
  if(!POOL.length)return;
  openMovie(POOL[Math.floor(Math.random()*POOL.length)].id);
};
renderFilters();renderRule();refresh();
</script>
</body>
</html>
